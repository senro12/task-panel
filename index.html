<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务面板</title>
<style>
:root{
  --bg:#f2f4f7; --card:#fff; --text:#2c3340; --muted:#98a1b0;
  --line:#e8ebf0; --danger:#e5484d;
  --purple:#8b5cf6; --blue:#3b82f6; --green:#22c55e; --orange:#f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); overflow:hidden;
}
.topbar{height:48px;display:flex;align-items:center;gap:10px;padding:0 18px;flex-shrink:0;background:linear-gradient(135deg,#4f8df7,#7c5cf0 55%,#9d5cf0);box-shadow:0 2px 10px rgba(93,95,240,.28)}
.app-title{font-size:15px;font-weight:700;color:#fff;display:flex;align-items:center;gap:7px}
.app-title svg{flex-shrink:0}
.topbar-actions{margin-left:auto;display:flex;gap:8px}
.scheme-btn{border:none;background:rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-size:13px;color:#fff;cursor:pointer;font-family:inherit;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scheme-btn:hover{background:rgba(255,255,255,.34)}
.pop-row{display:flex;align-items:center;gap:2px;padding:0 2px}
.pop-row .pop-item{flex:1}
.pop-row.active .pop-item{color:var(--blue);font-weight:500}
.pop-act{border:none;background:transparent;color:var(--muted);cursor:pointer;padding:4px;border-radius:5px;font-size:12px;line-height:1;flex-shrink:0;opacity:0}
.pop-row:hover .pop-act{opacity:1}
.pop-act:hover{background:#e9edf2;color:var(--text)}
.pop-del:hover{color:var(--danger);background:#fdeaea}
.btn-alt{background:#eef4ff;color:var(--blue)}
.btn-alt:hover{background:#e0ebff}
@media (hover:none){.pop-act{opacity:.5}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2c3340;color:#fff;font-size:13px;padding:8px 16px;border-radius:8px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.app{
  display:grid; grid-template-columns:1fr 1.2fr 1.2fr; grid-template-rows:1fr 1fr;
  gap:14px; padding:14px; height:calc(100vh - 48px);
}
.panel{
  background:var(--card); border-radius:12px;
  box-shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  display:flex; flex-direction:column; min-height:0; overflow:hidden;
}
#panel-longterm{grid-column:1;grid-row:1/3}
#panel-daily{grid-column:2;grid-row:1/3}
#panel-weekly{grid-column:3;grid-row:1}
#panel-monthly{grid-column:3;grid-row:2}
.panel.drop-target{outline:2px dashed var(--blue);outline-offset:-3px;background:#f6f9ff}
.panel-head{padding:11px 14px;border-bottom:1px solid var(--line)}
.panel-title{display:flex;align-items:center;gap:8px}
.panel-title h2{font-size:15px;font-weight:600}
.count{margin-left:auto;font-size:12px;color:var(--muted);background:#f1f3f6;border-radius:10px;padding:1px 8px}
.count:empty{display:none}
.mini-btn{border:none;background:#f1f3f6;color:#5b6472;font-size:11px;border-radius:6px;padding:2px 8px;cursor:pointer;font-family:inherit}
.mini-btn:hover{background:#e6e9ef}
.topbar .mini-btn{background:rgba(255,255,255,.22);color:#fff;font-size:12px;padding:4px 12px;border-radius:999px}
.topbar .mini-btn:hover{background:rgba(255,255,255,.34)}
.panel-sub{font-size:12px;color:var(--muted)}
.task-list{flex:1;overflow-y:auto;padding:10px 12px;min-height:0}
.task-list:empty{padding:0}
.task{background:#f7f8fa;border:1px solid #eef0f4;border-radius:8px;padding:8px 10px;margin-bottom:8px}
.task:hover{border-color:#dfe3ea}
.task.dragging{opacity:.4}
.task{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.task input,.task textarea{-webkit-user-select:text;user-select:text}
.touch-ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;opacity:.95;box-shadow:0 10px 28px rgba(16,24,40,.28);margin:0}
.task-row{display:flex;gap:8px;align-items:flex-start}
.task input[type=checkbox]{width:16px;height:16px;flex-shrink:0;cursor:pointer;margin-top:2px}
.t-main{flex:1;min-width:0}
.t-head{display:flex;gap:6px;align-items:flex-start}
.t-head .t-title{flex:1;min-width:0}
.t-title{font-size:14px;line-height:20px;cursor:text;word-break:break-word}
.t-title.done{text-decoration:line-through;color:var(--muted)}
.t-title.opt:not(.done){color:#7b8494}
.title-input{width:100%;font-size:14px;line-height:20px;border:1px solid var(--blue);border-radius:5px;padding:1px 6px;outline:none;font-family:inherit}
.pill{flex-shrink:0;font-size:10px;line-height:16px;padding:0 7px;border-radius:9px;cursor:pointer;user-select:none;margin-top:2px;white-space:nowrap;font-family:inherit}
.pill-must{background:#fdeaea;color:#d13438}
.pill-must:hover{background:#f9d7d7}
.pill-opt{background:#edf0f4;color:#8a93a3}
.pill-opt:hover{background:#e3e7ee}
.pill-group{background:#eef2ff;color:#6366f1;max-width:96px;overflow:hidden;text-overflow:ellipsis}
.pill-group:hover{background:#e0e7ff}
.icon-btn{border:none;background:transparent;cursor:pointer;color:var(--muted);padding:2px;border-radius:5px;opacity:0;transition:opacity .12s,background .12s;flex-shrink:0;display:flex;align-items:center}
.icon-btn svg{display:block}
.task:hover .icon-btn{opacity:1}
.icon-btn:hover{background:#e9edf2;color:var(--text)}
.note-btn.has-note{opacity:.85}
@media (hover:none){.icon-btn{opacity:.55}}
.note-editor{margin-top:8px}
.note-editor textarea{width:100%;min-height:56px;font-size:13px;line-height:1.5;border:1px solid var(--line);border-radius:6px;padding:6px 8px;resize:vertical;outline:none;font-family:inherit;background:#fff}
.note-editor textarea:focus{border-color:var(--blue)}
.sec-head{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#5b6472;margin:4px 0 2px;padding:0 2px;user-select:none}
.sec-head.toggle{cursor:pointer}
.sec-head .chev{font-size:10px;color:var(--muted);width:10px}
.sec-count{font-weight:400;color:var(--muted)}
.sec-divider{height:1px;background:var(--line);margin:10px 0}
.group-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:8px 0 2px;padding:0 2px}
.group-name{font-weight:500}
.g-must .group-name{color:#d13438}
.g-opt .group-name{color:#8a93a3}
.group-count{font-size:11px;opacity:.85}
.group-del{margin-left:auto;border:none;background:transparent;color:var(--muted);cursor:pointer;padding:1px;border-radius:4px;opacity:0;display:flex}
.group-row:hover .group-del{opacity:1}
.group-del:hover{color:var(--danger);background:#fdeaea}
.empty{flex:1;display:flex;align-items:center;justify-content:center;color:#b8bfca;font-size:13px;min-height:70px;padding-bottom:14vh}
.add-bar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#fbfcfd}
.add-input{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;outline:none;background:#fff;font-family:inherit}
.add-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.add-btn{width:32px;height:32px;border:none;border-radius:8px;color:#fff;font-size:17px;cursor:pointer;line-height:1;flex-shrink:0}
.add-btn:hover{filter:brightness(1.08)}
.pop-menu{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,.14);padding:4px;min-width:140px;max-height:260px;overflow-y:auto}
.pop-item{display:block;width:100%;text-align:left;border:none;background:transparent;font-size:13px;color:var(--text);padding:6px 10px;border-radius:6px;cursor:pointer;font-family:inherit}
.pop-item:hover{background:#f1f4f8}
.pop-item.active{color:var(--blue);font-weight:500}
.pop-item.new{color:var(--blue)}
.pop-divider{height:1px;background:var(--line);margin:4px 6px}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.42);display:flex;align-items:center;justify-content:center;z-index:50}
.modal-overlay.hidden{display:none}
.modal{background:#fff;border-radius:12px;padding:20px;width:320px;box-shadow:0 10px 30px rgba(16,24,40,.2)}
.modal-text{font-size:14px;line-height:1.5}
.modal-text b{word-break:break-all}
.modal-hint{font-size:12px;color:var(--muted);margin-top:6px}
.modal-input{width:100%;margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;outline:none;font-family:inherit}
.modal-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.modal-actions button{border:none;border-radius:8px;padding:7px 16px;font-size:13px;cursor:pointer;font-family:inherit}
.btn-cancel{background:#eef0f4;color:var(--text)}
.btn-cancel:hover{background:#e4e7ec}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{filter:brightness(1.08)}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{filter:brightness(1.08)}
.tabs{display:none}
@media (max-width:900px){
  body{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
  .chrome{
    position:sticky;top:0;z-index:20;flex-shrink:0;
    background:rgba(242,244,247,.95);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  }
  .topbar{height:auto;padding:6px 12px}
  .tabs{display:flex;gap:4px;padding:5px 10px 0}
  .tab{flex:1;border:none;background:transparent;font-size:14px;color:var(--muted);padding:7px 0 6px;cursor:pointer;font-family:inherit;position:relative}
  .tab.active{color:var(--text);font-weight:600;background:#fff;border-radius:10px 10px 0 0}
  .tab.active::after{content:'';position:absolute;left:22%;right:22%;bottom:0;height:2px;border-radius:2px}
  .tab-daily.active::after{background:var(--blue)}
  .tab-weekly.active::after{background:var(--green)}
  .tab-monthly.active::after{background:var(--orange)}
  .tab-longterm.active::after{background:var(--purple)}
  .app{display:flex;flex-direction:column;flex:1;min-height:0;height:auto;padding:0 10px 10px}
  .panel{display:none}
  .panel.active{display:flex;flex:1;min-height:0;border-radius:0 0 12px 12px}
}
</style>
</head>
<body>
<div class="chrome">
  <header class="topbar">
    <span class="app-title">任务面板</span>
    <button class="scheme-btn" id="scheme-btn">默认方案</button>
    <span class="topbar-actions">
      <button class="mini-btn" id="export-btn">导出</button>
      <button class="mini-btn" id="import-btn">导入</button>
    </span>
  </header>
  <nav class="tabs" id="tabs">
    <button class="tab tab-daily active" data-tab="daily">每日</button>
    <button class="tab tab-weekly" data-tab="weekly">每周</button>
    <button class="tab tab-monthly" data-tab="monthly">每月</button>
    <button class="tab tab-longterm" data-tab="longterm">长期</button>
  </nav>
</div>
<input type="file" id="import-file" accept=".json,application/json" hidden>
<div class="app">
  <section class="panel" id="panel-longterm" data-board="longterm">
    <header class="panel-head">
      <div class="panel-title">
        <h2>长期</h2>
        <span class="panel-sub" id="sub-longterm">手动勾选 · 不自动重置</span>
        <span class="count" id="count-longterm"></span>
        <button class="mini-btn" id="add-group-btn">＋ 分组</button>
      </div>
    </header>
    <div class="task-list" id="list-longterm"></div>
    <div class="empty" id="empty-longterm">暂无任务</div>
    <footer class="add-bar">
      <input type="text" class="add-input" data-add="longterm" placeholder="添加长期任务，回车确认">
      <button class="add-btn" data-addbtn="longterm">＋</button>
    </footer>
  </section>

  <section class="panel active" id="panel-daily" data-board="daily">
    <header class="panel-head">
      <div class="panel-title"><h2>每日</h2><span class="panel-sub" id="sub-daily"></span><span class="count" id="count-daily"></span></div>
    </header>
    <div class="task-list" id="list-daily"></div>
    <div class="empty" id="empty-daily">暂无任务</div>
    <footer class="add-bar">
      <input type="text" class="add-input" data-add="daily" placeholder="添加每日任务，回车确认">
      <button class="add-btn" data-addbtn="daily">＋</button>
    </footer>
  </section>

  <section class="panel" id="panel-weekly" data-board="weekly">
    <header class="panel-head">
      <div class="panel-title"><h2>每周</h2><span class="panel-sub" id="sub-weekly"></span><span class="count" id="count-weekly"></span></div>
    </header>
    <div class="task-list" id="list-weekly"></div>
    <div class="empty" id="empty-weekly">暂无任务</div>
    <footer class="add-bar">
      <input type="text" class="add-input" data-add="weekly" placeholder="添加每周任务，回车确认">
      <button class="add-btn" data-addbtn="weekly">＋</button>
    </footer>
  </section>

  <section class="panel" id="panel-monthly" data-board="monthly">
    <header class="panel-head">
      <div class="panel-title"><h2>每月</h2><span class="panel-sub" id="sub-monthly"></span><span class="count" id="count-monthly"></span></div>
    </header>
    <div class="task-list" id="list-monthly"></div>
    <div class="empty" id="empty-monthly">暂无任务</div>
    <footer class="add-bar">
      <input type="text" class="add-input" data-add="monthly" placeholder="添加每月任务，回车确认">
      <button class="add-btn" data-addbtn="monthly">＋</button>
    </footer>
  </section>
</div>

<div class="modal-overlay hidden" id="confirm-overlay">
  <div class="modal">
    <p class="modal-text" id="confirm-text"></p>
    <p class="modal-hint" id="confirm-hint"></p>
    <div class="modal-actions">
      <button class="btn-cancel" id="confirm-cancel">取消</button>
      <button class="btn-alt" id="confirm-alt" hidden>导入为新方案</button>
      <button class="btn-danger" id="confirm-ok">删除</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="input-overlay">
  <div class="modal">
    <p class="modal-text" id="input-label">新建分组</p>
    <input type="text" class="modal-input" id="input-field" placeholder="输入分组名称">
    <div class="modal-actions">
      <button class="btn-cancel" id="input-cancel">取消</button>
      <button class="btn-primary" id="input-ok">确定</button>
    </div>
  </div>
</div>

<script>
'use strict';
const BASE_KEY='taskPanel.v1';
const DEMO=location.hash==='#demo';
const STORAGE_KEY=BASE_KEY+(DEMO?'-demo':'');
const BOARDS={
  longterm:{name:'长期',color:'#8b5cf6'},
  daily:{name:'每日',color:'#3b82f6'},
  weekly:{name:'每周',color:'#22c55e'},
  monthly:{name:'每月',color:'#f59e0b'}
};
const DONE_COLOR='#a9b1bf';
const WEEKDAY=['日','一','二','三','四','五','六'];
const NOTE_SVG='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-6-6z"/><path d="M14 3v6h6"/></svg>';
const X_SVG='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';

let pendingDelete=null,confirmCb=null,confirmAltCb=null,inputCb=null,lastNoteClose=0,dragTaskId=null;
let doneOpen={longterm:true,daily:true,weekly:true,monthly:true};
let groupMenu=null,suppressOpen=false;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function pad(n){return String(n).padStart(2,'0');}
function dateKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function mondayOf(d){
  const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const wd=x.getDay()===0?7:x.getDay();
  x.setDate(x.getDate()-(wd-1));
  return x;
}
function isoWeek(d){
  const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const wd=x.getUTCDay()||7;
  x.setUTCDate(x.getUTCDate()+4-wd);
  const y0=new Date(Date.UTC(x.getUTCFullYear(),0,1));
  return Math.ceil(((x-y0)/86400000+1)/7);
}
function periodKey(board){
  const now=new Date();
  if(board==='daily')return dateKey(now);
  if(board==='weekly')return dateKey(mondayOf(now));
  if(board==='monthly')return now.getFullYear()+'-'+pad(now.getMonth()+1);
  return 'longterm';
}
function isDone(t){return t.donePeriod===periodKey(t.board);}
function sameSection(a,b){
  if(a.board!==b.board)return false;
  if(a.board==='longterm')return (a.group||'')===(b.group||'')&&isDone(a)===isDone(b);
  return (a.priority!=='opt')===(b.priority!=='opt')&&isDone(a)===isDone(b);
}
function boardSub(board){
  const now=new Date();
  if(board==='daily')return (now.getMonth()+1)+'月'+now.getDate()+'日 · 周'+WEEKDAY[now.getDay()];
  if(board==='weekly'){
    const mon=mondayOf(now),sun=new Date(mon);
    sun.setDate(sun.getDate()+6);
    return '第'+isoWeek(now)+'周 · '+pad(mon.getMonth()+1)+'.'+pad(mon.getDate())+' - '+pad(sun.getMonth()+1)+'.'+pad(sun.getDate());
  }
  if(board==='monthly')return now.getFullYear()+'年'+(now.getMonth()+1)+'月';
  return '手动勾选 · 不自动重置';
}
function demoData(){
  return{
    groups:['学习提升','家庭事务'],
    tasks:[
      {id:'demo-d1',board:'daily',title:'晨间复盘 10 分钟',note:'',priority:'must',donePeriod:periodKey('daily')},
      {id:'demo-d2',board:'daily',title:'阅读 30 页',note:'',priority:'opt',donePeriod:null},
      {id:'demo-d3',board:'daily',title:'运动 30 分钟',note:'保持心率区间',priority:'must',donePeriod:null},
      {id:'demo-w1',board:'weekly',title:'整理周报',note:'',priority:'must',donePeriod:null},
      {id:'demo-w2',board:'weekly',title:'照片备份到 NAS',note:'',priority:'opt',donePeriod:periodKey('weekly')},
      {id:'demo-m1',board:'monthly',title:'月度预算核对',note:'',priority:'must',donePeriod:null},
      {id:'demo-m2',board:'monthly',title:'订阅服务盘点',note:'',priority:'opt',donePeriod:null},
      {id:'demo-l1',board:'longterm',title:'考取 PMP 认证',note:'12 月考试',group:'学习提升',donePeriod:null},
      {id:'demo-l2',board:'longterm',title:'读完《深入理解计算机系统》',note:'',group:'学习提升',donePeriod:null},
      {id:'demo-l3',board:'longterm',title:'完成房屋续租',note:'',group:'家庭事务',donePeriod:'longterm'},
      {id:'demo-l4',board:'longterm',title:'年度体检复查',note:'',group:'',donePeriod:null}
    ]
  };
}
function normalize(arr,gs){
  const tasks=(Array.isArray(arr)?arr:[])
    .filter(t=>t&&typeof t.title==='string'&&BOARDS[t.board])
    .map(t=>({
      id:t.id||uid(),board:t.board,title:t.title,note:t.note||'',
      donePeriod:t.donePeriod||null,
      priority:t.priority==='opt'?'opt':'must',
      group:(t.board==='longterm'&&typeof t.group==='string')?t.group:''
    }));
  const groups=(Array.isArray(gs)?gs:[]).filter(g=>typeof g==='string'&&g);
  tasks.forEach(t=>{if(t.board==='longterm'&&t.group&&!groups.includes(t.group))groups.push(t.group);});
  return{tasks,groups};
}
function load(){
  let schemes=[],activeId=null;
  const mk=(name,data)=>({id:uid(),name,createdAt:new Date().toISOString(),data});
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const data=JSON.parse(raw);
      if(data&&Array.isArray(data.schemes)&&data.schemes.length){
        schemes=data.schemes
          .filter(s=>s&&s.data&&typeof s.name==='string')
          .map(s=>({id:s.id||uid(),name:s.name,createdAt:s.createdAt||new Date().toISOString(),
            data:normalize(s.data.tasks,s.data.groups)}));
        activeId=(data.activeId&&schemes.some(s=>s.id===data.activeId))?data.activeId:(schemes[0]&&schemes[0].id);
      }else{
        const arr=Array.isArray(data)?data:(data&&Array.isArray(data.tasks))?data.tasks:[];
        const gs=Array.isArray(data)?[]:(data&&Array.isArray(data.groups))?data.groups:[];
        schemes=[mk('默认方案',normalize(arr,gs))];
        activeId=schemes[0].id;
      }
    }
  }catch(e){}
  if(!schemes.length){
    if(DEMO){const d=demoData();schemes=[mk('默认方案',normalize(d.tasks,d.groups))];}
    else schemes=[mk('默认方案',{tasks:[],groups:[]})];
    activeId=schemes[0].id;
  }
  return{schemes,activeId};
}
let state=load();
let schemes=state.schemes;
let activeId=state.activeId;
function activeScheme(){return schemes.find(s=>s.id===activeId);}
function reloadWorking(){const s=activeScheme();tasks=s.data.tasks;groups=s.data.groups;}
let tasks=activeScheme().data.tasks;
let groups=activeScheme().data.groups;
function save(){
  const s=activeScheme();
  if(s)s.data={tasks,groups};
  localStorage.setItem(STORAGE_KEY,JSON.stringify({version:3,schemes,activeId}));
}

function el(tag,cls,text){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(text!==undefined)e.textContent=text;
  return e;
}
function pill(text,cls){
  const p=el('span','pill '+cls,text);
  return p;
}

function renderTopbar(){
  const s=activeScheme();
  document.getElementById('scheme-btn').textContent=s?s.name:'';
}
function periodicSubsections(list,arr){
  const must=arr.filter(t=>t.priority!=='opt');
  const opt=arr.filter(t=>t.priority==='opt');
  if(must.length){
    const h=el('div','group-row g-must');
    h.appendChild(el('span','group-name','必做'));
    h.appendChild(el('span','group-count',must.length));
    list.appendChild(h);
    must.forEach(t=>list.appendChild(taskEl(t)));
  }
  if(opt.length){
    const h=el('div','group-row g-opt');
    h.appendChild(el('span','group-name','选做'));
    h.appendChild(el('span','group-count',opt.length));
    list.appendChild(h);
    opt.forEach(t=>list.appendChild(taskEl(t)));
  }
}
function render(){
  renderTopbar();
  for(const key of ['daily','weekly','monthly']){
    const list=document.getElementById('list-'+key);
    list.textContent='';
    const bt=tasks.filter(t=>t.board===key);
    const undone=bt.filter(t=>!isDone(t));
    const doneArr=bt.filter(t=>isDone(t));
    document.getElementById('empty-'+key).style.display=bt.length?'none':'flex';
    document.getElementById('count-'+key).textContent=bt.length?doneArr.length+'/'+bt.length:'';
    document.getElementById('sub-'+key).textContent=boardSub(key);
    if(!bt.length)continue;
    list.appendChild(secHead('未完成',undone.length,false));
    periodicSubsections(list,undone);
    list.appendChild(el('div','sec-divider'));
    list.appendChild(secHead('已完成',doneArr.length,key));
    if(doneOpen[key])periodicSubsections(list,doneArr);
  }
  renderLongterm();
}

function secHead(label,count,toggleKey){
  const h=el('div','sec-head'+(toggleKey?' toggle':''));
  h.appendChild(el('span',null,label));
  if(toggleKey)h.appendChild(el('span','chev',doneOpen[toggleKey]?'▾':'▸'));
  h.appendChild(el('span','sec-count',count));
  if(toggleKey)h.addEventListener('click',()=>{doneOpen[toggleKey]=!doneOpen[toggleKey];render();});
  return h;
}
function groupRow(name,count){
  const h=el('div','group-row');
  h.appendChild(el('span','group-name',name));
  if(count)h.appendChild(el('span','group-count',count));
  const x=el('button','group-del');
  x.innerHTML=X_SVG;x.title='删除分组（任务移至未分组）';
  x.addEventListener('click',()=>openConfirm('删除分组「'+name+'」？','分组内的任务将移至「未分组」','删除',()=>{
    groups=groups.filter(g=>g!==name);
    tasks.forEach(t=>{if(t.board==='longterm'&&t.group===name)t.group='';});
    save();render();
  }));
  h.appendChild(x);
  return h;
}
function appendGrouped(list,arr,onlyNonEmpty){
  if(!groups.length){arr.forEach(t=>list.appendChild(taskEl(t)));return;}
  for(const g of groups){
    const gt=arr.filter(t=>(t.group||'')===g);
    if(onlyNonEmpty&&!gt.length)continue;
    list.appendChild(groupRow(g,gt.length));
    gt.forEach(t=>list.appendChild(taskEl(t)));
  }
  const ug=arr.filter(t=>!t.group);
  if(ug.length){
    list.appendChild(groupRow('未分组',ug.length));
    ug.forEach(t=>list.appendChild(taskEl(t)));
  }
}
function renderLongterm(){
  const list=document.getElementById('list-longterm');
  list.textContent='';
  const lt=tasks.filter(t=>t.board==='longterm');
  document.getElementById('empty-longterm').style.display=lt.length?'none':'flex';
  const doneArr=lt.filter(t=>isDone(t));
  document.getElementById('count-longterm').textContent=lt.length?doneArr.length+'/'+lt.length:'';
  if(!lt.length)return;
  list.appendChild(secHead('未完成',lt.length-doneArr.length,false));
  appendGrouped(list,lt.filter(t=>!isDone(t)),false);
  list.appendChild(el('div','sec-divider'));
  list.appendChild(secHead('已完成',doneArr.length,'longterm'));
  if(doneOpen.longterm)appendGrouped(list,doneArr,true);
}

function taskEl(t){
  const container=el('div','task');
  container.draggable=true;container.dataset.id=t.id;
  const row=el('div','task-row');

  const cb=document.createElement('input');
  cb.type='checkbox';cb.checked=isDone(t);
  cb.style.accentColor=isDone(t)?DONE_COLOR:BOARDS[t.board].color;
  cb.addEventListener('change',()=>{t.donePeriod=cb.checked?periodKey(t.board):null;save();render();});

  const main=el('div','t-main');
  const head=el('div','t-head');
  if(t.board==='longterm'){
    const gp=pill(t.group||'未分组','pill-group');
    gp.title='点击选择分组';
    gp.addEventListener('click',e=>{e.stopPropagation();openGroupMenu(t,gp);});
    head.appendChild(gp);
  }else{
    const must=t.priority!=='opt';
    const pp=pill(must?'必做':'选做',must?'pill-must':'pill-opt');
    pp.title='点击切换为'+(must?'选做':'必做');
    pp.addEventListener('click',e=>{e.stopPropagation();t.priority=must?'opt':'must';save();render();});
    head.appendChild(pp);
  }
  const optCls=t.board!=='longterm'&&t.priority==='opt'?' opt':'';
  const title=el('div','t-title'+(isDone(t)?' done':'')+optCls,t.title);
  title.addEventListener('click',()=>startTitleEdit(t,title));
  head.appendChild(title);
  main.appendChild(head);

  container.addEventListener('dragover',e=>{
    if(!dragTaskId||dragTaskId===t.id)return;
    const dragged=tasks.find(x=>x.id===dragTaskId);
    if(!dragged||!sameSection(dragged,t))return;
    e.preventDefault();e.stopPropagation();
    const draggingEl=document.querySelector('.task.dragging');
    if(!draggingEl)return;
    const rect=container.getBoundingClientRect();
    if(e.clientY>rect.top+rect.height/2)container.after(draggingEl);
    else container.before(draggingEl);
  });

  const noteBtn=el('button','icon-btn note-btn'+(t.note?' has-note':''));
  noteBtn.innerHTML=NOTE_SVG;
  noteBtn.title=t.note?'备注：'+t.note:'添加备注';
  if(t.note)noteBtn.style.color=BOARDS[t.board].color;
  noteBtn.addEventListener('click',e=>{e.stopPropagation();toggleNoteEditor(t,container);});

  const delBtn=el('button','icon-btn del-btn');
  delBtn.innerHTML=X_SVG;delBtn.title='删除任务';
  delBtn.addEventListener('click',e=>{e.stopPropagation();openConfirm('删除任务「'+t.title+'」？','删除后无法恢复','删除',()=>{
    tasks=tasks.filter(x=>x.id!==t.id);save();render();
  });});

  row.append(cb,main,noteBtn,delBtn);
  container.appendChild(row);
  return container;
}

function startTitleEdit(t,titleEl){
  if(titleEl.querySelector('input'))return;
  const taskElm=titleEl.closest('.task');
  taskElm.draggable=false;
  const input=document.createElement('input');
  input.className='title-input';input.value=t.title;
  titleEl.textContent='';titleEl.appendChild(input);
  input.focus();input.select();
  let closed=false;
  const finish=ok=>{
    if(closed)return;closed=true;
    const v=input.value.trim();
    if(ok&&v&&v!==t.title){t.title=v;save();}
    titleEl.textContent=t.title;
    titleEl.className='t-title'+(isDone(t)?' done':'')+(t.board!=='longterm'&&t.priority==='opt'?' opt':'');
    taskElm.draggable=true;
  };
  input.addEventListener('keydown',e=>{
    e.stopPropagation();
    if(e.key==='Enter')finish(true);
    else if(e.key==='Escape')finish(false);
  });
  input.addEventListener('blur',()=>finish(true));
  input.addEventListener('click',e=>e.stopPropagation());
}

function refreshNoteBtn(taskElm,t){
  const btn=taskElm.querySelector('.note-btn');
  btn.className='icon-btn note-btn'+(t.note?' has-note':'');
  btn.title=t.note?'备注：'+t.note:'添加备注';
  btn.style.color=t.note?BOARDS[t.board].color:'';
}
function toggleNoteEditor(t,taskElm){
  if(Date.now()-lastNoteClose<250)return;
  const existing=taskElm.querySelector('.note-editor');
  document.querySelectorAll('.note-editor').forEach(n=>n.remove());
  if(existing)return;
  const wrap=el('div','note-editor');
  const ta=document.createElement('textarea');
  ta.value=t.note||'';ta.placeholder='填写备注…';
  wrap.appendChild(ta);taskElm.appendChild(wrap);
  ta.focus();
  let closed=false;
  const finish=()=>{
    if(closed)return;closed=true;
    const v=ta.value.trim();
    if(v!==t.note){t.note=v;save();}
    lastNoteClose=Date.now();
    wrap.remove();
    refreshNoteBtn(taskElm,t);
  };
  ta.addEventListener('blur',finish);
  ta.addEventListener('keydown',e=>{
    e.stopPropagation();
    if(e.key==='Escape'){closed=true;lastNoteClose=Date.now();wrap.remove();}
  });
}

/* ---------- 拖拽换区 ---------- */
function persistBoardOrder(board){
  const listEl=document.getElementById('list-'+board);
  if(!listEl)return;
  const ids=[...listEl.querySelectorAll('.task')].map(n=>n.dataset.id);
  const boardTasks=ids.map(id=>tasks.find(x=>x.id===id)).filter(Boolean);
  if(boardTasks.length)tasks=tasks.filter(x=>x.board!==board).concat(boardTasks);
  save();
}
function applyBoardChange(t,board){
  t.board=board;t.donePeriod=null;
  if(board==='longterm')t.group=t.group||'';
  else t.priority=t.priority==='opt'?'opt':'must';
}
document.querySelectorAll('.panel').forEach(panel=>{
  const board=panel.dataset.board;
  panel.addEventListener('dragover',e=>{
    e.preventDefault();
    const dt=dragTaskId?tasks.find(x=>x.id===dragTaskId):null;
    if(dt&&dt.board===board)return;
    panel.classList.add('drop-target');
  });
  panel.addEventListener('dragleave',e=>{if(!panel.contains(e.relatedTarget))panel.classList.remove('drop-target');});
  panel.addEventListener('drop',e=>{
    e.preventDefault();panel.classList.remove('drop-target');
    const id=e.dataTransfer.getData('text/plain');
    const t=tasks.find(x=>x.id===id);
    if(!t)return;
    if(t.board===board){
      if(!(e.target.closest&&e.target.closest('.task'))){
        tasks=tasks.filter(x=>x.id!==id);
        tasks.push(t);
        save();render();
      }
      return;
    }
    applyBoardChange(t,board);
    save();render();
  });
});
document.addEventListener('dragstart',e=>{
  const taskElm=e.target.closest?e.target.closest('.task'):null;
  if(!taskElm)return;
  taskElm.classList.add('dragging');
  dragTaskId=taskElm.dataset.id;
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',taskElm.dataset.id);
});
document.addEventListener('dragend',()=>{
  const dt=dragTaskId?tasks.find(x=>x.id===dragTaskId):null;
  if(dt)persistBoardOrder(dt.board);
  dragTaskId=null;
  document.querySelectorAll('.dragging').forEach(n=>n.classList.remove('dragging'));
  document.querySelectorAll('.drop-target').forEach(n=>n.classList.remove('drop-target'));
});

/* ---------- 触屏长按拖拽 ---------- */
let touchDrag=null;
function startTouchDrag(td){
  td.active=true;
  if(navigator.vibrate)navigator.vibrate(30);
  td.ghost=td.el.cloneNode(true);
  td.ghost.className='task touch-ghost';
  td.ghost.style.width=td.el.getBoundingClientRect().width+'px';
  td.ghost.style.transform='translate('+(td.lastX-td.ox)+'px,'+(td.lastY-td.oy)+'px) scale(1.04)';
  document.body.appendChild(td.ghost);
  td.el.classList.add('dragging');
  requestAnimationFrame(touchLoop);
}
function touchHitTest(x,y){
  const td=touchDrag;
  if(!td||!td.active)return;
  const under=document.elementFromPoint(x,y);
  const taskElm=under?under.closest('.task'):null;
  if(!taskElm||taskElm===td.el)return;
  const target=tasks.find(t=>t.id===taskElm.dataset.id);
  if(!target||!sameSection(td.task,target))return;
  const rect=taskElm.getBoundingClientRect();
  if(y>rect.top+rect.height/2)taskElm.after(td.el);
  else taskElm.before(td.el);
}
function touchLoop(){
  const td=touchDrag;
  if(!td||!td.active)return;
  const listEl=document.getElementById('list-'+td.task.board);
  if(listEl){
    const rect=listEl.getBoundingClientRect();
    const zone=56;
    if(td.lastY<rect.top+zone)listEl.scrollTop-=(rect.top+zone-td.lastY)*0.22;
    else if(td.lastY>rect.bottom-zone)listEl.scrollTop+=(td.lastY-rect.bottom+zone)*0.22;
  }
  touchHitTest(td.lastX,td.lastY);
  requestAnimationFrame(touchLoop);
}
document.addEventListener('touchstart',e=>{
  if(e.touches.length!==1)return;
  const t=e.touches[0];
  const el=e.target.closest?e.target.closest('.task'):null;
  if(!el)return;
  if(e.target.closest('input,button,textarea,.note-editor,.pill'))return;
  const task=tasks.find(x=>x.id===el.dataset.id);
  if(!task)return;
  const rect=el.getBoundingClientRect();
  touchDrag={el,task,identifier:t.identifier,startX:t.clientX,startY:t.clientY,
    lastX:t.clientX,lastY:t.clientY,ox:t.clientX-rect.left,oy:t.clientY-rect.top,
    active:false,ghost:null,
    timer:setTimeout(()=>{
      if(touchDrag&&touchDrag.el===el)startTouchDrag(touchDrag);
    },250)};
},{passive:true});
document.addEventListener('touchmove',e=>{
  const td=touchDrag;
  if(!td)return;
  let t=null;
  for(const tt of e.touches){if(tt.identifier===td.identifier){t=tt;break;}}
  if(!t)return;
  td.lastX=t.clientX;td.lastY=t.clientY;
  if(!td.active){
    if(Math.abs(t.clientX-td.startX)>10||Math.abs(t.clientY-td.startY)>10){
      clearTimeout(td.timer);touchDrag=null;
    }
    return;
  }
  e.preventDefault();
  td.ghost.style.transform='translate('+(t.clientX-td.ox)+'px,'+(t.clientY-td.oy)+'px) scale(1.04)';
  touchHitTest(t.clientX,t.clientY);
},{passive:false});
function onTouchEnd(e){
  const td=touchDrag;
  if(!td)return;
  let ours=false;
  for(const ct of e.changedTouches){if(ct.identifier===td.identifier)ours=true;}
  if(!ours)return;
  clearTimeout(td.timer);
  const wasActive=td.active;
  touchDrag=null;
  if(!wasActive)return;
  if(e.cancelable)e.preventDefault();
  if(td.ghost)td.ghost.remove();
  td.el.classList.remove('dragging');
  const under=document.elementFromPoint(td.lastX,td.lastY);
  const panel=under?under.closest('.panel'):null;
  const newBoard=panel?panel.dataset.board:null;
  if(newBoard&&newBoard!==td.task.board){
    applyBoardChange(td.task,newBoard);
    save();render();
  }else{
    persistBoardOrder(td.task.board);
  }
}
document.addEventListener('touchend',onTouchEnd);
document.addEventListener('touchcancel',onTouchEnd);

    });
    row.append(ren,del);
    menu.appendChild(row);
  });
  menu.appendChild(el('div','pop-divider'));
  const nb=el('button','pop-item new','＋ 新建方案');
  nb.addEventListener('click',()=>{
    closeSchemeMenu();
    openInputModal('新建方案','输入方案名称',v=>{
      v=v.trim();if(!v)return;
      const s={id:uid(),name:v,createdAt:new Date().toISOString(),data:{tasks:[],groups:[]}};
      schemes.push(s);activeId=s.id;reloadWorking();save();render();
      showToast('已创建并切换到「'+v+'」');
    });
  });
  menu.appendChild(nb);
  document.body.appendChild(menu);
  const r=anchor.getBoundingClientRect();
  const mw=menu.offsetWidth,mh=menu.offsetHeight;
  let left=Math.max(10,Math.min(r.left,window.innerWidth-mw-10));
  let top=r.bottom+4;
  if(top+mh>window.innerHeight-10)top=Math.max(10,r.top-mh-4);
  menu.style.left=left+'px';menu.style.top=top+'px';
  schemeMenu=menu;
}
function switchScheme(id){
  if(id===activeId)return;
  activeId=id;reloadWorking();save();render();
  showToast('已切换到「'+activeScheme().name+'」');
}

/* ---------- 导入 / 导出 ---------- */
const toastEl=document.createElement('div');
toastEl.className='toast';
document.body.appendChild(toastEl);
let toastTimer=null;
function showToast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2200);
}

document.getElementById('export-btn').addEventListener('click',()=>{
  const data={app:'task-panel',version:2,exportedAt:new Date().toISOString(),groups:groups,tasks:tasks};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='任务面板备份-'+dateKey(new Date()).replace(/-/g,'')+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  showToast('已导出「'+activeScheme().name+'」：'+tasks.length+' 个任务');
});

const importFile=document.getElementById('import-file');
document.getElementById('import-btn').addEventListener('click',()=>importFile.click());
importFile.addEventListener('change',()=>{
  const f=importFile.files[0];
  importFile.value='';
  if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{
    let parsed;
    try{parsed=JSON.parse(reader.result);}catch(e){showToast('文件不是有效的 JSON');return;}
    const arr=Array.isArray(parsed)?parsed:(parsed&&Array.isArray(parsed.tasks))?parsed.tasks:null;
    if(!arr){showToast('文件里没有任务数据');return;}
    const gs=Array.isArray(parsed)?[]:(parsed.groups||[]);
    openConfirm('导入备份「'+f.name+'」？','当前方案「'+activeScheme().name+'」有 '+tasks.length+' 个任务，备份含 '+arr.length+' 个','覆盖当前方案',()=>{
      const st=normalize(arr,gs);
      tasks=st.tasks;groups=st.groups;
      save();render();
      showToast('已覆盖当前方案：'+tasks.length+' 个任务');
    },'导入为新方案',()=>{
      const name=f.name.replace(/\.json$/i,'')||'导入方案';
      const st=normalize(arr,gs);
      const s={id:uid(),name:name,createdAt:new Date().toISOString(),data:st};
      schemes.push(s);activeId=s.id;
      tasks=st.tasks;groups=st.groups;
      save();render();
      showToast('已导入为新方案「'+name+'」：'+tasks.length+' 个任务');
    });
  };
  reader.readAsText(f);
});

/* ---------- 跨周期自动刷新 ---------- */
let lastSig=['daily','weekly','monthly'].map(k=>periodKey(k)).join('|');
setInterval(()=>{
  const sig=['daily','weekly','monthly'].map(k=>periodKey(k)).join('|');
  if(sig!==lastSig){lastSig=sig;render();}
},30000);

render();
</script>
