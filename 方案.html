<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方案</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:36px 20px 50px;background:#f3f5f8;color:#1f2937;
       font-family:"PingFang SC","Microsoft YaHei","DengXian","等线",-apple-system,"Segoe UI",sans-serif;
       -webkit-font-smoothing:antialiased;}
  .page{max-width:1200px;margin:0 auto;}
  h1{margin:0 0 6px;font-size:22px;display:flex;align-items:center;gap:10px;}
  h1::before{content:"";width:6px;height:22px;border-radius:3px;background:linear-gradient(#203864,#595959);}
  .sub{margin:0 0 22px;color:#6b7280;font-size:13px;}
  .sub b{color:#217346;font-weight:600;}
  table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:14px;background:#fff;}
  th,td{border-right:1px solid #c5cdd6;border-bottom:1px solid #c5cdd6;
        text-align:center;vertical-align:middle;height:42px;padding:8px 6px;}
  th:last-child,td:last-child{border-right:2px solid #94a3b8;}
  th:first-child,td:first-child{border-left:2px solid #94a3b8;}
  thead th{border-top:2px solid #94a3b8;}
  tr:last-child td{border-bottom:2px solid #94a3b8;}
  tr.row-hd th{background:#203864;color:#fff;font-weight:600;}
  tr.row-gray td{background:#f6f8fa;}
  tr.row-white td{background:#fff;}
  tr.row-src td{background:#203864;color:#fff;font-weight:600;}
  tr td.dg{background:#595959;color:#fff;font-weight:600;}
  th.center,td.center{text-align:center;vertical-align:middle;}
  .v{display:inline-block;min-width:1.5em;min-height:1.3em;padding:1px 5px;border-radius:4px;
     outline:none;cursor:text;transition:background .12s,box-shadow .12s;}
  .v.computed{cursor:default;font-weight:600;color:#111827;}
  td.dg .v, tr.row-hd .v, tr.row-src .v{color:#fff;}
  td.dg .v[contenteditable]:hover{background:rgba(255,255,255,.18);box-shadow:0 0 0 1px rgba(255,255,255,.6) inset;}
  td.dg .v[contenteditable]:focus{background:rgba(255,255,255,.22);box-shadow:0 0 0 2px #fff;}
  tr.row-hd .v[contenteditable]:hover{background:rgba(255,255,255,.18);box-shadow:0 0 0 1px rgba(255,255,255,.6) inset;}
  tr.row-hd .v[contenteditable]:focus{background:rgba(255,255,255,.22);box-shadow:0 0 0 2px #fff;}
  tr.row-src .v[contenteditable]:hover{background:rgba(255,255,255,.18);box-shadow:0 0 0 1px rgba(255,255,255,.6) inset;}
  tr.row-src .v[contenteditable]:focus{background:rgba(255,255,255,.22);box-shadow:0 0 0 2px #fff;}
  tr.row-gray .v[contenteditable]:hover{background:rgba(59,130,246,.10);box-shadow:0 0 0 1px #93c5fd inset;}
  tr.row-gray .v[contenteditable]:focus{background:#fff;box-shadow:0 0 0 2px #3b82f6;}
  tr.row-white .v[contenteditable]:hover{background:rgba(59,130,246,.10);box-shadow:0 0 0 1px #93c5fd inset;}
  tr.row-white .v[contenteditable]:focus{background:#fff;box-shadow:0 0 0 2px #3b82f6;}
  td.data-cell{position:relative;padding:0;}
  .cell-text{display:block;padding:9px 4px;min-height:1.3em;font-weight:600;color:#111827;
             font-variant-numeric:tabular-nums;}
  select.cell-select{position:absolute;inset:0;width:100%;height:100%;opacity:0;
                     border:none;cursor:pointer;font:inherit;padding:0;}
</style>
</head>
<body>
<div class="page">
  <h1>方案</h1>
  <p class="sub">主表数据格（第 2～9 列）<b>点击即弹出下拉选择</b>（选项 = 第八行“总计”右侧的非“--”内容，第八行改名后选项与已选内容自动同步；未选择的格子显示[空]）；<b>第 10 行</b>自动统计每个名称出现的次数，<b>第 9 行第 1 格</b>为第 9 行数字之和；第一列深灰格文字可直接编辑；<b>数据自动保存在本浏览器</b>（刷新/重开/页面更新都不丢，每人各自一份，不写回任何文件）</p>

<tr class="row-gray"><td class="dg center"><span class="v" contenteditable spellcheck="false" data-rc="2,1"></span></td><td class="data-cell"><span class="cell-text" data-cur="2,2"></span><select class="cell-select" data-rc="2,2"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="2,3"></span><select class="cell-select" data-rc="2,3"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="2,4"></span><select class="cell-select" data-rc="2,4"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="2,5"></span><select class="cell-select" data-rc="2,5"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="2,6"></span><select class="cell-select" data-rc="2,6"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="2,7"></span><select class="cell-select" data-rc="2,7"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="2,8"></span><select class="cell-select" data-rc="2,8"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="2,9"></span><select class="cell-select" data-rc="2,9"><option value="">[空]</option></select></td></tr>

<tr class="row-white"><td class="dg center"><span class="v" contenteditable spellcheck="false" data-rc="4,1"></span></td><td class="data-cell"><span class="cell-text" data-cur="4,2"></span><select class="cell-select" data-rc="4,2"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="4,3"></span><select class="cell-select" data-rc="4,3"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="4,4"></span><select class="cell-select" data-rc="4,4"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="4,5"></span><select class="cell-select" data-rc="4,5"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="4,6"></span><select class="cell-select" data-rc="4,6"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="4,7"></span><select class="cell-select" data-rc="4,7"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="4,8"></span><select class="cell-select" data-rc="4,8"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="4,9"></span><select class="cell-select" data-rc="4,9"><option value="">[空]</option></select></td></tr>
<tr class="row-white"><td class="dg center"><span class="v" contenteditable spellcheck="false" data-rc="5,1"></span></td><td class="data-cell"><span class="cell-text" data-cur="5,2"></span><select class="cell-select" data-rc="5,2"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="5,3"></span><select class="cell-select" data-rc="5,3"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="5,4"></span><select class="cell-select" data-rc="5,4"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="5,5"></span><select class="cell-select" data-rc="5,5"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="5,6"></span><select class="cell-select" data-rc="5,6"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="5,7"></span><select class="cell-select" data-rc="5,7"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="5,8"></span><select class="cell-select" data-rc="5,8"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="5,9"></span><select class="cell-select" data-rc="5,9"><option value="">[空]</option></select></td></tr>
<tr class="row-white"><td class="dg center"><span class="v" contenteditable spellcheck="false" data-rc="6,1"></span></td><td class="data-cell"><span class="cell-text" data-cur="6,2"></span><select class="cell-select" data-rc="6,2"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="6,3"></span><select class="cell-select" data-rc="6,3"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="6,4"></span><select class="cell-select" data-rc="6,4"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="6,5"></span><select class="cell-select" data-rc="6,5"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="6,6"></span><select class="cell-select" data-rc="6,6"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="6,7"></span><select class="cell-select" data-rc="6,7"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="6,8"></span><select class="cell-select" data-rc="6,8"><option value="">[空]</option></select></td><td class="data-cell"><span class="cell-text" data-cur="6,9"></span><select class="cell-select" data-rc="6,9"><option value="">[空]</option></select></td></tr>
<tr class="row-gray"><td class="dg center"><span class="v" contenteditable spellcheck="false" data-rc="7,1"></span></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
<tr class="row-src"><td class="center"><span class="v" contenteditable spellcheck="false" data-rc="8,1">总计</span></td><td class="center"><span class="v" contenteditable spellcheck="false" data-rc="8,2">--</span></td><td class="center"><span class="v" contenteditable spellcheck="false" data-rc="8,3">--</span></td><td class="center"><span class="v" contenteditable spellcheck="false" data-rc="8,4">--</span></td><td class="center"><span class="v" contenteditable spellcheck="false" data-rc="8,5">--</span></td><td class="center"><span class="v" contenteditable spellcheck="false" data-rc="8,6">--</span></td><td class="center"><span class="v" contenteditable spellcheck="false" data-rc="8,7">--</span></td><td class="center"><span class="v" contenteditable spellcheck="false" data-rc="8,8">--</span></td><td class="center"><span class="v" contenteditable spellcheck="false" data-rc="8,9">--</span></td></tr>
<tr class="row-gray"><td class="dg center"><span class="v computed" data-rc="9,1"></span></td><td class="center"><span class="v" contenteditable spellcheck="false" data-rc="9,2"></span></td><td class="center"><span class="v" contenteditable spellcheck="false" data-rc="9,3"></span></td><td class="center"><span class="v" contenteditable spellcheck="false" data-rc="9,4"></span></td><td class="center"><span class="v" contenteditable spellcheck="false" data-rc="9,5"></span></td><td class="center"><span class="v" contenteditable spellcheck="false" data-rc="9,6"></span></td><td class="center"><span class="v" contenteditable spellcheck="false" data-rc="9,7"></span></td><td class="center"><span class="v" contenteditable spellcheck="false" data-rc="9,8"></span></td><td class="center"><span class="v" contenteditable spellcheck="false" data-rc="9,9"></span></td></tr>
<tr class="row-white"><td class="dg center"><span class="v computed" data-rc="10,1"></span></td><td class="center"><span class="v computed" data-rc="10,2"></span></td><td class="center"><span class="v computed" data-rc="10,3"></span></td><td class="center"><span class="v computed" data-rc="10,4"></span></td><td class="center"><span class="v computed" data-rc="10,5"></span></td><td class="center"><span class="v computed" data-rc="10,6"></span></td><td class="center"><span class="v computed" data-rc="10,7"></span></td><td class="center"><span class="v computed" data-rc="10,8"></span></td><td class="center"><span class="v computed" data-rc="10,9"></span></td></tr>
  </table>
</div>
<script>
(function(){
  var STORE_KEY = 'fangan-data-v3';
  var grid = {};
  document.querySelectorAll('[data-rc]').forEach(function(el){ grid[el.dataset.rc] = el; });
  function cellText(el){
    if(!el) return '';
    if(el.tagName === 'SELECT') return el.value;
    return el.textContent.trim();
  }
  function val(r,c){
    var t = cellText(grid[r+','+c]); if(t==='') return null;
    var n = Number(t); return isNaN(n) ? null : n;
  }
  function setDisp(r,c,v){
    var el = grid[r+','+c]; if(el) el.textContent = (v === 0 ? '' : String(v));
  }
  function rawText(r,c){ return cellText(grid[r+','+c]); }
  function saveData(){
    try{
      var data = {};
      document.querySelectorAll('[data-rc]').forEach(function(el){
        data[el.dataset.rc] = cellText(el);
      });
      localStorage.setItem(STORE_KEY, JSON.stringify(data));
    }catch(err){}
  }
  function syncDisplay(s){
    var sp = s.parentElement.querySelector('.cell-text');
    if(sp) sp.textContent = s.value || '[空]';       // 空状态显示 [空]
  }
  function rebuildOptions(){
    var opts = [];
    for(var c=2;c<=9;c++){
      var t = rawText(8,c);
      if(t !== '' && t !== '--' && opts.indexOf(t) === -1) opts.push(t);
    }
    document.querySelectorAll('select.cell-select').forEach(function(s){
      var cur = s.value;
      s.innerHTML = '<option value="">[空]</option>' +
        opts.map(function(o){ return '<option value="' + o + '">' + o + '</option>'; }).join('');
      if(cur !== '' && opts.indexOf(cur) !== -1) s.value = cur;
    });
  }
  function restoreData(){
    var data = null;
    try{
      var raw = localStorage.getItem(STORE_KEY);
      data = raw ? JSON.parse(raw) : null;
    }catch(err){ return; }
    if(!data) return;
    Object.keys(data).forEach(function(rc){
      var el = grid[rc]; if(!el || el.classList.contains('computed')) return;
      var v = data[rc] || '';
      if(el.tagName === 'SELECT'){
        if(v !== '' && !el.querySelector('option[value="' + v + '"]')){
          var o = document.createElement('option');
          o.value = v; o.textContent = v; el.appendChild(o);
        }
        el.value = v;
        syncDisplay(el);
      } else {
        el.textContent = v;
      }
    });
  }
  var prevSrc = {};
  function syncRename(el){
    var rc = el.dataset && el.dataset.rc; if(!rc) return;
    var parts = rc.split(',');
    if(parts[0] !== '8' || Number(parts[1]) < 2) return;   // 仅第八行第 2～9 格是选项来源
    var c = parts[1];
    var newName = el.textContent.trim();
    var oldName = prevSrc[c];
    if(oldName && oldName !== newName){
      document.querySelectorAll('select.cell-select').forEach(function(s){
        if(s.value === oldName){
          s.value = newName;
          var sp = s.parentElement.querySelector('.cell-text');
          if(sp) sp.textContent = newName;
        }
      });
    }
    prevSrc[c] = newName;
  }
  function compute(){
    // 第 10 行第 c 格：第八行第 c 格标签在第 2～9 列第 2～6 行数据中出现的次数
    var counts = [];
    for(var c=2;c<=9;c++){
      var label = rawText(8,c).toLowerCase();
      var cnt = 0;
      if(label !== '' && label !== '--'){
        for(var r=2;r<=6;r++) for(var cc=2;cc<=9;cc++){
          var t = rawText(r,cc).toLowerCase();
          if(t !== '' && t === label) cnt++;
        }
      }
      counts.push(cnt);
      setDisp(10,c,cnt);
    }
    // 第 9 行第 1 格：第 9 行第 2～9 格数字之和
    var sum9 = 0;
    for(var c=2;c<=9;c++){ var n = val(9,c); if(n!==null) sum9 += n; }
    setDisp(9,1,sum9);
    // 第 10 行第 1 格：计数之和
    var sum10 = 0;
    for(var i=0;i<counts.length;i++) sum10 += counts[i];
    setDisp(10,1,sum10);
  }
  document.querySelector('.main-table').addEventListener('input', function(e){
    if(e.target && e.target.tagName === 'SELECT') syncDisplay(e.target);
    syncRename(e.target);
    rebuildOptions();
    compute();
    saveData();
  });
  restoreData();
  for(var c=2;c<=9;c++) prevSrc[c] = rawText(8,c);
  rebuildOptions();
  document.querySelectorAll('select.cell-select').forEach(function(s){ syncDisplay(s); });
  compute();
})();
</script>
</body>
</html>
